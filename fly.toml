# fly.toml app configuration file generated for familymeal-vwm7xg on 2026-03-11T19:46:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'familymeal-vwm7xg'
primary_region = 'ord'

[build]

[env]
  FAMILY_MEAL_DATA_DIR = "/app/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = "data"
  destination = "/app/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
